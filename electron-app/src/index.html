<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna JARVIS</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: transparent;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #e0e0ff;
            overflow: hidden;
            user-select: none;
        }

        #app {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: rgba(10, 10, 20, 0.85);
            border: 1px solid rgba(150, 50, 255, 0.2);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            -webkit-app-region: drag;
        }

        /* ── Title Bar ─────────────────────────────────────── */

        #titlebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(150, 50, 255, 0.08);
            border-bottom: 1px solid rgba(150, 50, 255, 0.15);
            border-radius: 16px 16px 0 0;
            -webkit-app-region: drag;
        }

        #titlebar .title {
            font-size: 13px;
            font-weight: 600;
            color: #cc99ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #titlebar .controls {
            display: flex;
            gap: 6px;
            -webkit-app-region: no-drag;
        }

        .ctrl-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #888;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .ctrl-btn:hover {
            background: rgba(150, 50, 255, 0.3);
            color: #e0e0ff;
        }

        .ctrl-btn.close:hover {
            background: rgba(255, 50, 50, 0.5);
        }

        /* ── Status Bar ────────────────────────────────────── */

        #status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 12px;
            background: rgba(0,0,0,0.2);
            font-size: 11px;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #4ade80;
            display: inline-block;
        }

        .status-dot.disconnected { background: #f87171; }
        .status-dot.listening { background: #f87171; animation: pulse 1s infinite; }
        .status-dot.thinking { background: #fbbf24; animation: pulse 0.5s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .mode-tabs {
            display: flex;
            gap: 4px;
        }

        .mode-tab {
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 10px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.08);
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-tab.active {
            background: rgba(150, 50, 255, 0.2);
            border-color: rgba(150, 50, 255, 0.4);
            color: #cc99ff;
        }

        /* ── Chat Area ─────────────────────────────────────── */

        #chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            -webkit-app-region: no-drag;
        }

        #chat-area::-webkit-scrollbar {
            width: 4px;
        }

        #chat-area::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat-area::-webkit-scrollbar-thumb {
            background: rgba(150, 50, 255, 0.3);
            border-radius: 2px;
        }

        .msg {
            margin-bottom: 10px;
            animation: msgIn 0.3s ease;
        }

        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg .bubble {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            max-width: 85%;
            word-wrap: break-word;
        }

        .msg.user .bubble {
            background: rgba(100, 100, 255, 0.12);
            border: 1px solid rgba(100, 100, 255, 0.25);
            margin-left: auto;
        }

        .msg.luna .bubble {
            background: rgba(150, 50, 255, 0.12);
            border: 1px solid rgba(150, 50, 255, 0.25);
        }

        .msg .meta {
            font-size: 10px;
            color: #666;
            margin-top: 3px;
        }

        .msg.user .meta { text-align: right; }

        .msg.system .bubble {
            background: rgba(100,100,100,0.1);
            border: 1px solid rgba(100,100,100,0.2);
            text-align: center;
            font-size: 11px;
            color: #888;
            max-width: 100%;
        }

        /* ── Input Area ────────────────────────────────────── */

        #input-area {
            padding: 10px 12px;
            background: rgba(0,0,0,0.15);
            border-top: 1px solid rgba(150, 50, 255, 0.1);
            border-radius: 0 0 16px 16px;
            -webkit-app-region: no-drag;
        }

        #input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        #msg-input {
            flex: 1;
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(150, 50, 255, 0.2);
            border-radius: 20px;
            padding: 10px 16px;
            color: #e0e0ff;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        #msg-input:focus {
            border-color: rgba(150, 50, 255, 0.6);
        }

        #msg-input::placeholder {
            color: #555;
        }

        .action-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(150, 50, 255, 0.3);
            background: rgba(150, 50, 255, 0.1);
            color: #cc99ff;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .action-btn:hover {
            background: rgba(150, 50, 255, 0.3);
            transform: scale(1.05);
        }

        .action-btn.recording {
            background: rgba(255, 50, 50, 0.3);
            border-color: rgba(255, 50, 50, 0.5);
            animation: pulse 1s infinite;
        }

        /* ── Audio Player ──────────────────────────────────── */

        .audio-player {
            margin-top: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .play-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: rgba(150, 50, 255, 0.2);
            border: 1px solid rgba(150, 50, 255, 0.4);
            color: #cc99ff;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .audio-wave {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 20px;
        }

        .audio-wave .bar {
            width: 3px;
            background: rgba(150, 50, 255, 0.5);
            border-radius: 2px;
            animation: wave 1s ease-in-out infinite;
        }

        @keyframes wave {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }
    
        /* ── Suggestions ───────────────────────────────────── */

        .suggestions {
            margin: 8px 0;
            padding: 8px 12px;
            background: rgba(150, 50, 255, 0.06);
            border: 1px solid rgba(150, 50, 255, 0.15);
            border-radius: 10px;
            font-size: 12px;
        }

        .suggestions .sugg-header {
            color: #cc99ff;
            font-size: 11px;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .suggestions .sugg-item {
            padding: 4px 0;
            color: #aaa;
            cursor: pointer;
            transition: color 0.2s;
        }

        .suggestions .sugg-item:hover {
            color: #e0e0ff;
        }

        .suggestions .sugg-item::before {
            content: '\2022 ';
            color: #cc99ff;
        }

        /* ── Streaming Text ─────────────────────────────────── */

        .msg.streaming .bubble {
            border-right: 2px solid rgba(150, 50, 255, 0.6);
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { border-color: transparent; }
        }

        /* ── Avatar ─────────────────────────────────────── */

        #avatar-container {
            position: relative;
            overflow: hidden;
            background: radial-gradient(ellipse at center, rgba(150, 50, 255, 0.08) 0%, rgba(10, 10, 20, 0.3) 50%, transparent 80%);
            border-bottom: 1px solid rgba(150, 50, 255, 0.08);
        }

        #avatar-container canvas {
            display: block;
            margin: 0 auto;
        }

        /* ── Dashboard ──────────────────────────────────────── */

        #dashboard-toggle {
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 10px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.08);
            color: #666;
            cursor: pointer;
            transition: all 0.2s;
        }

        #dashboard-toggle:hover {
            background: rgba(150, 50, 255, 0.15);
            color: #cc99ff;
        }

        #dashboard-toggle.active {
            background: rgba(150, 50, 255, 0.2);
            border-color: rgba(150, 50, 255, 0.4);
            color: #cc99ff;
        }

        #dashboard-panel {
            display: none;
            background: rgba(10, 10, 20, 0.95);
            border: 1px solid rgba(150, 50, 255, 0.2);
            border-radius: 0 0 12px 12px;
            padding: 10px 12px;
            font-size: 11px;
            max-height: 200px;
            overflow-y: auto;
            animation: slideDown 0.2s ease;
        }

        #dashboard-panel.visible {
            display: block;
        }

        @keyframes slideDown {
            from { opacity: 0; max-height: 0; }
            to { opacity: 1; max-height: 200px; }
        }

        .dash-section {
            margin-bottom: 8px;
        }

        .dash-section:last-child {
            margin-bottom: 0;
        }

        .dash-section h4 {
            color: #cc99ff;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .dash-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            color: #aaa;
        }

        .dash-row .label {
            color: #888;
        }

        .dash-row .value {
            color: #e0e0ff;
            font-weight: 500;
        }

        .dash-emotion-bar {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 3px;
        }

        .dash-emotion-chip {
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 9px;
            background: rgba(150, 50, 255, 0.1);
            border: 1px solid rgba(150, 50, 255, 0.2);
            color: #aaa;
        }

        .dash-session {
            padding: 3px 0;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            color: #aaa;
        }

        .dash-session:last-child {
            border-bottom: none;
        }

        .dash-session .session-time {
            color: #666;
            font-size: 9px;
        }

        .dash-refresh {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 9px;
            background: rgba(150, 50, 255, 0.1);
            border: 1px solid rgba(150, 50, 255, 0.2);
            color: #cc99ff;
            cursor: pointer;
            margin-top: 4px;
        }

        .dash-refresh:hover {
            background: rgba(150, 50, 255, 0.2);
        }

        /* ── Voice Level Meter ─────────────────────────────── */

        #voice-level {
            display: none;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
            padding: 4px 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
        }

        #voice-level.active {
            display: flex;
        }

        .level-bar {
            flex: 1;
            height: 4px;
            background: rgba(255,255,255,0.08);
            border-radius: 2px;
            overflow: hidden;
        }

        .level-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4ade80, #fbbf24, #f87171);
            border-radius: 2px;
            transition: width 0.05s ease;
        }

        #voice-timer {
            font-size: 10px;
            color: #888;
            min-width: 35px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        /* ── Typing Indicator ──────────────────────────────── */

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 18px;
            align-items: center;
        }

        .typing-indicator .dot {
            width: 6px;
            height: 6px;
            background: #cc99ff;
            border-radius: 50%;
            animation: typingBounce 1.4s ease-in-out infinite;
        }

        .typing-indicator .dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* ── Particles Background ───────────────────────────── */

        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(150, 50, 255, 0.3);
            border-radius: 50%;
            animation: float 8s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
            25% { opacity: 0.6; }
            50% { transform: translateY(-40px) translateX(20px); opacity: 0.3; }
            75% { opacity: 0.5; }
        }

    </style>
</head>
<body>
    <div id="app">
        <div id="particles"></div>
        <!-- Title Bar -->
        <div id="titlebar">
            <div class="title">🌙 Luna JARVIS</div>
            <div class="controls">
                <button class="ctrl-btn" id="btn-minimize" title="Minimizar">─</button>
                <button class="ctrl-btn close" id="btn-close" title="Cerrar">✕</button>
            </div>
        </div>

        <!-- Status Bar -->
        <div id="status-bar">
            <div class="status-left">
                <span class="status-dot" id="ws-dot"></span>
                <span id="ws-status">Conectando...</span>
                <span id="avatar-state" style="color: #888;"></span>
            </div>
            <div class="mode-tabs">
                <button class="mode-tab active" data-mode="casa">🏠</button>
                <button class="mode-tab" data-mode="trabajo">💼</button>
                <button class="mode-tab" data-mode="moto">🏍️</button>
                <button class="mode-tab" data-mode="noche">🌙</button>
                <button id="dashboard-toggle" title="Dashboard">📊</button>
            </div>
        </div>

        <!-- Dashboard Panel (collapsible) -->
        <div id="dashboard-panel">
            <div id="dash-content">Cargando...</div>
        </div>

        <!-- Avatar Area -->
        <div id="avatar-container" style="width: 100%; height: 180px; display: flex; align-items: center; justify-content: center; -webkit-app-region: no-drag;"></div>

        <!-- Chat Area -->
        <div id="chat-area">
            <div class="msg system">
                <div class="bubble">🌙 Luna JARVIS iniciada</div>
            </div>
        </div>

        <!-- Input Area -->
        <div id="input-area">
            <div id="input-row">
                <input type="text" id="msg-input" placeholder="Escribe un mensaje..." autocomplete="off">
                <button class="action-btn" id="mic-btn" title="Grabar voz">🎤</button>
                <button class="action-btn" id="send-btn" title="Enviar">➤</button>
            </div>
            <div id="voice-level">
                <div class="level-bar"><div class="fill" id="level-fill"></div></div>
                <span id="voice-timer">0:00</span>
            </div>
        </div>
    </div>

    <script src="src/three.min.js"></script>
    <script src="src/avatar.js"></script>
    <script>
        // ── Avatar ──────────────────────────────────────────────

        let lunaAvatar = null;
        try {
            if (typeof THREE === 'undefined') {
                throw new Error('Three.js no se cargó');
            }
            lunaAvatar = new LunaAvatar('avatar-container');
            if (!lunaAvatar.container) {
                throw new Error('Contenedor avatar no encontrado');
            }
            console.log('✅ Avatar Luna inicializado correctamente');
        } catch (e) {
            console.error('❌ Avatar init failed:', e.message);
            const container = document.getElementById('avatar-container');
            if (container) {
                container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;flex-direction:column;gap:8px;"><span style="font-size:48px;">🌙</span><span style="font-size:11px;color:#666;">Avatar no disponible</span></div>';
            }
        }

        // ── Elements ────────────────────────────────────────────

        const chatArea = document.getElementById('chat-area');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const micBtn = document.getElementById('mic-btn');
        const wsDot = document.getElementById('ws-dot');
        const wsStatus = document.getElementById('ws-status');
        const avatarState = document.getElementById('avatar-state');
        const voiceLevel = document.getElementById('voice-level');
        const levelFill = document.getElementById('level-fill');
        const voiceTimer = document.getElementById('voice-timer');

        // ── Chat Functions ──────────────────────────────────────

        function addMessage(text, sender = 'user', extras = {}) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;

            let html = `<div class="bubble">${escapeHtml(text)}</div>`;

            if (extras.audio) {
                html += `
                    <div class="audio-player">
                        <button class="play-btn" onclick="playAudio('${extras.audio}')">▶</button>
                        <div class="audio-wave">
                            <div class="bar" style="animation-delay: 0s"></div>
                            <div class="bar" style="animation-delay: 0.1s"></div>
                            <div class="bar" style="animation-delay: 0.2s"></div>
                            <div class="bar" style="animation-delay: 0.3s"></div>
                            <div class="bar" style="animation-delay: 0.4s"></div>
                        </div>
                    </div>
                `;
            }

            const time = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
            html += `<div class="meta">${time}</div>`;

            div.innerHTML = html;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ── Audio Playback with Mouth Sync ──────────────────────

        let audioCtx = null;
        let audioAnalyser = null;
        let mouthSyncFrame = null;

        function getAudioContext() {
            if (!audioCtx || audioCtx.state === 'closed') {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function playAudio(base64Data) {
            try {
                const ctx = getAudioContext();
                const binaryStr = atob(base64Data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) {
                    bytes[i] = binaryStr.charCodeAt(i);
                }

                ctx.decodeAudioData(bytes.buffer, (buffer) => {
                    const source = ctx.createBufferSource();
                    source.buffer = buffer;

                    // Create analyser for mouth sync
                    const analyser = ctx.createAnalyser();
                    analyser.fftSize = 256;
                    analyser.smoothingTimeConstant = 0.4;

                    source.connect(analyser);
                    analyser.connect(ctx.destination);

                    // Start mouth sync
                    if (lunaAvatar) {
                        const dataArray = new Uint8Array(analyser.frequencyBinCount);
                        let lastAmplitude = 0;

                        function updateMouth() {
                            analyser.getByteFrequencyData(dataArray);
                            let sum = 0;
                            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                            const avg = sum / dataArray.length;
                            // Normalize to 0-1, apply some scaling for natural look
                            const amplitude = Math.min(1, (avg / 128) * 1.2);
                            // Extra smoothing to avoid jitter
                            const smoothed = lastAmplitude * 0.3 + amplitude * 0.7;
                            lastAmplitude = smoothed;
                            lunaAvatar.setMouthAmplitude(smoothed);
                            mouthSyncFrame = requestAnimationFrame(updateMouth);
                        }
                        updateMouth();

                        // Stop mouth sync when audio ends
                        source.onended = () => {
                            if (mouthSyncFrame) {
                                cancelAnimationFrame(mouthSyncFrame);
                                mouthSyncFrame = null;
                            }
                            if (lunaAvatar) lunaAvatar.stopMouthSync();
                        };
                    }

                    source.start(0);
                }, (err) => {
                    console.warn('Audio decode failed, falling back to basic playback:', err);
                    // Fallback: basic Audio element
                    const audio = new Audio(`data:audio/wav;base64,${base64Data}`);
                    audio.play();
                });
            } catch (e) {
                console.error('playAudio error:', e);
                // Fallback
                const audio = new Audio(`data:audio/wav;base64,${base64Data}`);
                audio.play();
            }
        }

        // ── Send Message ────────────────────────────────────────

        function sendMessage() {
            const text = msgInput.value.trim();
            if (!text) return;

            // Track user message for emotion association (Session 38)
            lastUserMessage = text;

            // Reset streaming state so the next Luna response gets its own bubble
            if (streamingDiv) {
                streamingDiv.classList.remove('streaming');
                const t = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
                streamingDiv.querySelector('.meta').textContent = t;
                streamingDiv = null;
                streamingContent = '';
            }

            addMessage(text, 'user');
            msgInput.value = '';

            if (window.lunaAPI) {
                window.lunaAPI.sendMessage(text);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        msgInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // ── Voice Recording (Streaming) ─────────────────────

        let mediaRecorder = null;
        let isRecording = false;
        let useStreaming = true;
        let audioContext = null;
        let analyser = null;
        let animationFrameId = null;
        let recordingStartTime = null;
        let timerInterval = null;

        micBtn.addEventListener('click', async () => {
            if (isRecording) {
                stopRecording();
            } else {
                startRecording();
            }
        });

        function startLevelMeter(stream) {
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);

                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                voiceLevel.classList.add('active');

                function updateLevel() {
                    if (!isRecording) return;
                    analyser.getByteFrequencyData(dataArray);
                    let sum = 0;
                    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
                    const avg = sum / dataArray.length;
                    const pct = Math.min(100, (avg / 128) * 100);
                    levelFill.style.width = pct + '%';
                    animationFrameId = requestAnimationFrame(updateLevel);
                }
                updateLevel();
            } catch (e) {
                console.warn('Level meter error:', e);
            }
        }

        function stopLevelMeter() {
            if (animationFrameId) { cancelAnimationFrame(animationFrameId); animationFrameId = null; }
            if (audioContext) { audioContext.close().catch(() => {}); audioContext = null; }
            voiceLevel.classList.remove('active');
            levelFill.style.width = '0%';
        }

        function startTimer() {
            recordingStartTime = Date.now();
            voiceTimer.textContent = '0:00';
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
                const min = Math.floor(elapsed / 60);
                const sec = elapsed % 60;
                voiceTimer.textContent = min + ':' + String(sec).padStart(2, '0');
            }, 500);
        }

        function stopTimer() {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
            recordingStartTime = null;
        }

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                startLevelMeter(stream);
                startTimer();
                
                if (useStreaming && window.lunaAPI) {
                    // Streaming mode: send chunks in real-time
                    window.lunaAPI.audioStart();
                    
                    mediaRecorder = new MediaRecorder(stream, {
                        mimeType: 'audio/webm;codecs=opus'
                    });
                    
                    mediaRecorder.ondataavailable = async (e) => {
                        if (e.data.size > 0) {
                            const reader = new FileReader();
                            reader.onloadend = () => {
                                const base64 = reader.result.split(',')[1];
                                if (window.lunaAPI && isRecording) {
                                    window.lunaAPI.audioChunk(base64, 'webm');
                                }
                            };
                            reader.readAsDataURL(e.data);
                        }
                    };
                    
                    mediaRecorder.onstop = () => {
                        if (window.lunaAPI) {
                            window.lunaAPI.audioStop();
                        }
                        stream.getTracks().forEach(t => t.stop());
                        micBtn.classList.remove('recording');
                        isRecording = false;
                    };
                    
                    // Request data every 250ms for low latency
                    mediaRecorder.start(250);
                    
                } else {
                    // Batch mode: collect all audio then send
                    mediaRecorder = new MediaRecorder(stream);
                    let audioChunks = [];
                    
                    mediaRecorder.ondataavailable = (e) => {
                        audioChunks.push(e.data);
                    };
                    
                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(audioChunks, { type: 'audio/wav' });
                        const reader = new FileReader();
                        reader.onloadend = () => {
                            const base64 = reader.result.split(',')[1];
                            if (window.lunaAPI) {
                                window.lunaAPI.sendAudio(base64);
                            }
                        };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(t => t.stop());
                        micBtn.classList.remove('recording');
                        isRecording = false;
                    };
                    
                    mediaRecorder.start();
                }
                
                isRecording = true;
                micBtn.classList.add('recording');
                setAvatarState('listening');

            } catch (e) {
                console.error('Mic error:', e);
                addMessage('No se pudo acceder al micrófono', 'system');
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            stopLevelMeter();
            stopTimer();
        }

        // ── WebSocket Message Handling ──────────────────────────

        let streamingDiv = null;
        let streamingContent = '';

        if (window.lunaAPI) {
            window.lunaAPI.onMessage((msg) => {
                switch (msg.type) {
                    case 'text':
                        hideTypingIndicator();
                        if (msg.streaming === true) {
                            // Streaming: accumulate text
                            if (!streamingDiv) {
                                streamingDiv = document.createElement('div');
                                streamingDiv.className = 'msg luna streaming';
                                streamingDiv.innerHTML = '<div class="bubble"></div><div class="meta"></div>';
                                chatArea.appendChild(streamingDiv);
                            }
                            streamingContent += msg.content;
                            streamingDiv.querySelector('.bubble').textContent = streamingContent;
                            chatArea.scrollTop = chatArea.scrollHeight;
                            resetStreamingTimer();
                        } else if (msg.streaming === false) {
                            // Final message
                            if (streamingTimer) { clearTimeout(streamingTimer); streamingTimer = null; }
                            if (streamingDiv) {
                                streamingDiv.classList.remove('streaming');
                                const time = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
                                streamingDiv.querySelector('.meta').textContent = time;
                                streamingDiv = null;
                                streamingContent = '';
                            } else {
                                addMessage(msg.content, 'luna');
                            }
                        } else {
                            // Non-streaming message
                            addMessage(msg.content, 'luna');
                        }
                        break;

                    case 'audio':
                        if (msg.data) {
                            playAudio(msg.data);
                        }
                        break;

                    case 'status':
                        if (msg.state === 'thinking') {
                            setAvatarState('thinking');
                            showTypingIndicator();
                        } else if (msg.state === 'listening') {
                            setAvatarState('listening');
                        } else if (msg.state === 'ready') {
                            setAvatarState('idle');
                            hideTypingIndicator();
                        } else if (msg.state === 'speaking') {
                            setAvatarState('speaking');
                        }
                        break;

                    case 'suggestions':
                        showSuggestions(msg.items || []);
                        break;

                    case 'emotion':
                        if (msg.emotion) {
                            updateEmotionDisplay(msg.emotion);
                        }
                        break;

                    case 'transcript':
                        lastUserMessage = msg.content;
                        addMessage(`🎤 ${msg.content}`, 'system');
                        break;

                    case 'error':
                        addMessage(`⚠️ ${msg.message}`, 'system');
                        break;

                    case 'system':
                        if (msg.action === 'mode_changed') {
                            addMessage(`Modo: ${msg.mode.mode}`, 'system');
                        }
                        break;
                }
            });

        // ── Emotion Display ─────────────────────────────────────

        const emotionEmojis = {
            'happy': '😊', 'excited': '🤩', 'sad': '😢', 'frustrated': '😤',
            'angry': '😠', 'anxious': '😰', 'tired': '😴', 'curious': '🤔',
            'confused': '😕', 'grateful': '🥰', 'sarcastic': '😏', 'neutral': '😐',
            'surprised': '😲', 'embarrassed': '😳',
        };

        let currentEmotion = 'neutral';
        let emotionTimeout = null;
        let emotionHistory = [];  // Track last 20 emotions for timeline
        let emotionBadgeDiv = null;  // Real-time emotion badge element
        let dashAutoRefreshTimer = null;  // Dashboard auto-refresh
        let lastUserMessage = '';  // Track last user message for emotion association

        // Compound emotion blending (Session 38)
        const COMPOUND_EMOTIONS = {
            'happy+surprised': { name: 'delight', emoji: '🤩', color: '#ffaa44' },
            'happy+embarrassed': { name: 'shy_joy', emoji: '☺️', color: '#ff88aa' },
            'sad+angry': { name: 'bitter', emoji: '😤', color: '#884455' },
            'curious+surprised': { name: 'amazed', emoji: '🤯', color: '#aa66ff' },
            'happy+curious': { name: 'playful', emoji: '😏', color: '#88dd66' },
            'sad+embarrassed': { name: 'vulnerable', emoji: '🥺', color: '#9977aa' },
            'angry+surprised': { name: 'shocked', emoji: '🤬', color: '#ff4466' },
            'happy+grateful': { name: 'joyful', emoji: '🥳', color: '#ffaa66' },
        };
        let previousEmotion = 'neutral';  // For compound detection

        function detectCompoundEmotion(current, previous) {
            const key1 = `${previous}+${current}`;
            const key2 = `${current}+${previous}`;
            return COMPOUND_EMOTIONS[key1] || COMPOUND_EMOTIONS[key2] || null;
        }

        function updateEmotionDisplay(emotion) {
            const emoji = emotionEmojis[emotion.primary] || '😐';
            const intensity = Math.round(emotion.intensity * 100);
            const conf = Math.round(emotion.confidence * 100);

            // Track current emotion for mood persistence
            currentEmotion = emotion.primary || 'neutral';

            // Use backend compound if available, else detect on frontend (Session 40)
            let compound = emotion.compound || null;
            if (!compound) {
                compound = detectCompoundEmotion(currentEmotion, previousEmotion);
                if (compound && emotion.intensity > 0.5) {
                    emotion._compound = compound;
                } else {
                    compound = null;
                }
            } else {
                emotion._compound = compound;
            }
            previousEmotion = currentEmotion;

            // Add to emotion history with message context (keep last 20)
            emotionHistory.push({
                emotion: emotion.primary,
                intensity: emotion.intensity,
                confidence: emotion.confidence,
                time: Date.now(),
                message: lastUserMessage.substring(0, 120),
                compound: compound || null,
            });
            if (emotionHistory.length > 20) emotionHistory.shift();
            renderEmotionTimeline();
            renderEmotionSparkline();  // Session 40: live sparkline update

            // Show emotion indicator in status bar with intensity bar
            const intensityBar = '█'.repeat(Math.round(intensity / 10)) + '░'.repeat(10 - Math.round(intensity / 10));
            const compoundLabel = emotion._compound ? ` → ${emotion._compound.emoji} ${emotion._compound.name}` : '';
            avatarState.textContent = `${emoji} ${emotion.primary}${compoundLabel} ${intensityBar}`;
            avatarState.style.opacity = Math.max(0.6, emotion.intensity);

            // Update real-time emotion badge (floating)
            updateEmotionBadge(emotion);

            // Update Three.js avatar colors and shape based on emotion
            if (lunaAvatar) {
                lunaAvatar.setEmotion(emotion.primary, emotion.intensity, emotion._compound || null);
            }

            // Log for debugging
            console.log(`Emotion: ${emotion.primary} (${conf}% conf, ${intensity}% intensity)`);

            // Reset auto-clear timer — keeps mood until new emotion arrives
            if (emotionTimeout) clearTimeout(emotionTimeout);
            if (emotion.primary !== 'neutral') {
                emotionTimeout = setTimeout(() => {
                    // Fade status text but keep avatar colors (mood persistence)
                    if (avatarState.textContent.includes(emotion.primary)) {
                        avatarState.textContent = `${emoji} ${emotion.primary}`;
                        avatarState.style.opacity = 0.4;
                    }
                    // Fade badge too
                    if (emotionBadgeDiv) emotionBadgeDiv.style.opacity = '0.4';
                }, 15000);
            } else {
                // Neutral: clear status text and reset avatar
                avatarState.textContent = '';
                avatarState.style.opacity = 1;
                // Remove badge on neutral
                if (emotionBadgeDiv) {
                    emotionBadgeDiv.style.opacity = '0';
                    setTimeout(() => { if (emotionBadgeDiv) emotionBadgeDiv.style.display = 'none'; }, 500);
                }
            }
        }

        // ── Real-time Emotion Badge ─────────────────────────────
        function updateEmotionBadge(emotion) {
            if (!emotionBadgeDiv) {
                emotionBadgeDiv = document.createElement('div');
                emotionBadgeDiv.id = 'emotion-badge';
                emotionBadgeDiv.style.cssText = `

            const color = emotion._compound ? emotion._compound.color : (emotionColors[emotion.primary] || '#666688');
            const emoji = emotion._compound ? emotion._compound.emoji : (emotionEmojis[emotion.primary] || '😐');

        // ── Emotion Heatmap ─────────────────────────────────────

        function renderEmotionHeatmap(containerId) {
            const container = document.getElementById(containerId);
            if (!container || emotionHistory.length === 0) return;

            // Include compound emotions in counts (Session 38)
            const emotionCounts = {};
            emotionHistory.forEach(entry => {
                const key = entry.compound ? entry.compound.name : entry.emotion;
                if (!emotionCounts[key]) emotionCounts[key] = { count: 0, compound: entry.compound };
                emotionCounts[key].count++;
            });
            const sorted = Object.entries(emotionCounts).sort((a, b) => b[1].count - a[1].count).slice(0, 8);

            let html = '<div style="display:flex;flex-direction:column;gap:3px;margin:4px 0;">';
            sorted.forEach(([emo, data]) => {
                const color = data.compound ? data.compound.color : (emotionColors[emo] || '#666688');
                const emoji = data.compound ? data.compound.emoji : (emotionEmojis[emo] || '😐');
                const count = data.count;
                const pct = Math.min(100, (count / emotionHistory.length) * 100);
                html += `<div style="display:flex;align-items:center;gap:6px;font-size:9px;">`;
                html += `<span style="width:20px;text-align:center;">${emoji}</span>`;
                html += `<div style="flex:1;height:10px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden;">`;
                html += `<div style="width:${pct}%;height:100%;background:${color};border-radius:4px;opacity:0.7;transition:width 0.3s;"></div>`;
                html += `</div>`;
                html += `<span style="width:36px;text-align:right;color:#888;">${data.compound ? data.compound.name : emo} (${count})</span>`;
                html += `</div>`;
            });
            html += '</div>';
            container.innerHTML = html;
        }

        // ── Emotion Timeline ─────────────────────────────────────

        const emotionColors = {
            'happy': '#ffcc33', 'excited': '#ff6633', 'sad': '#4466cc', 'frustrated': '#cc4433',
            'angry': '#ff2222', 'anxious': '#9944cc', 'tired': '#667799', 'curious': '#33cc88',
            'confused': '#8866cc', 'grateful': '#ff8866', 'sarcastic': '#cc66ff', 'neutral': '#666688',

        function renderEmotionTimeline() {
            const container = document.getElementById('emotion-timeline');
            if (!container || emotionHistory.length === 0) return;

            let html = '<div style="display:flex;align-items:flex-end;gap:3px;height:40px;margin:4px 0;">';

        // ── Emotion Evolution Sparkline (Session 40) ──────────────
        function renderEmotionSparkline() {
            const canvas = document.getElementById('emotion-sparkline');
            if (!canvas || emotionHistory.length < 2) return;

            const ctx = canvas.getContext('2d');
            const dpr = window.devicePixelRatio || 1;
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            canvas.width = w * dpr;
            canvas.height = h * dpr;
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, w, h);

            const data = emotionHistory;
            const n = data.length;
            const padX = 4;
            const padY = 6;
            const chartW = w - padX * 2;
            const chartH = h - padY * 2;

            // Draw intensity line
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(150, 50, 255, 0.6)';
            ctx.lineWidth = 1.5;
            ctx.lineJoin = 'round';

            for (let i = 0; i < n; i++) {
                const x = padX + (i / (n - 1)) * chartW;
                const y = padY + chartH - (data[i].intensity * chartH);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Gradient fill under line
            const grad = ctx.createLinearGradient(0, padY, 0, padY + chartH);
            grad.addColorStop(0, 'rgba(150, 50, 255, 0.25)');
            grad.addColorStop(1, 'rgba(150, 50, 255, 0.02)');
            ctx.lineTo(padX + chartW, padY + chartH);
            ctx.lineTo(padX, padY + chartH);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();

            // Draw dots for each emotion
            for (let i = 0; i < n; i++) {
                const x = padX + (i / (n - 1)) * chartW;
                const y = padY + chartH - (data[i].intensity * chartH);
                const color = data[i].compound
                    ? data[i].compound.color
                    : (emotionColors[data[i].emotion] || '#666688');
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fillStyle = color;
                ctx.fill();
                // Glow for high intensity
                if (data[i].intensity > 0.7) {
                    ctx.beginPath();
                    ctx.arc(x, y, 5, 0, Math.PI * 2);
                    ctx.fillStyle = color + '33';
                    ctx.fill();
                }
            }

            // Draw baseline
            ctx.beginPath();
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.lineWidth = 0.5;
            ctx.moveTo(padX, padY + chartH);
            ctx.lineTo(padX + chartW, padY + chartH);
            ctx.stroke();
        }

        // ── Quick Actions (Session 38) ─────────────────────────
        async function quickAction(action) {
            const resultDiv = document.getElementById('quick-action-result');
            if (!resultDiv) return;
            resultDiv.textContent = 'Cargando...';
            try {
                let data;
                switch (action) {
                    case 'systeminfo':
                        data = await fetch('http://127.0.0.1:8765/status').then(r => r.json());
                        resultDiv.innerHTML = `CPU: ${data.cpu || '?'}% · RAM: ${data.ram || '?'}% · Disco: ${data.disk || '?'}%`;
                        break;
                    case 'weather':
                        data = await fetch('http://127.0.0.1:8765/command', {
                            method: 'POST', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({command: 'weather', params: {city: 'Santiago'}})
                        }).then(r => r.json());
                        if (data.error) { resultDiv.textContent = `⚠️ ${data.error}`; }
                        else { resultDiv.innerHTML = `${data.description || '?'} · ${data.temp_c || '?'}°C · 💧 ${data.humidity || '?'}%`;
                        }
                        break;
                    case 'volume':
                        data = await fetch('http://127.0.0.1:8765/command', {
                            method: 'POST', headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({command: 'volume', params: {action: 'get'}})
                        }).then(r => r.json());
                        if (data.error) { resultDiv.textContent = `⚠️ ${data.error}`; }
                        else { resultDiv.innerHTML = `🔊 ${data.level || '?'}% ${data.muted ? '(silenciado)' : ''}`; }
                        break;
                    case 'cache':
                        data = await fetch('http://127.0.0.1:8765/cache/stats').then(r => r.json());
                        resultDiv.innerHTML = `📦 ${data.entries || 0} entradas · ${data.size_mb || 0} MB`;
                        break;
                    case 'patterns':
                        data = await fetch('http://127.0.0.1:8765/patterns/stats').then(r => r.json());
                        resultDiv.innerHTML = `📊 ${data.total_interactions || 0} interacciones · ${data.unique_topics || 0} temas`;
                        break;
                    default:
                        resultDiv.textContent = 'Acción desconocida';
                }
            } catch (e) {
                resultDiv.textContent = `⚠️ Error: ${e.message}`;
            }
        }

        // ── Streaming Safety Net ────────────────────────────────
        // Finalize stale streaming divs after 30 seconds of inactivity
        let streamingTimer = null;

        function resetStreamingTimer() {
            if (streamingTimer) clearTimeout(streamingTimer);
            if (streamingDiv) {
                streamingTimer = setTimeout(() => {
                    if (streamingDiv) {
                        console.warn('⚠️ Streaming timeout — finalizando bubble stale');
                        streamingDiv.classList.remove('streaming');
                        const t = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
                        streamingDiv.querySelector('.meta').textContent = t;
                        streamingDiv = null;
                        streamingContent = '';
                    }
                }, 30000);
            }
        }

        // ── Particles ────────────────────────────────────────

        function createParticles() {
            const container = document.getElementById('particles');
            if (!container) return;
            for (let i = 0; i < 12; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 8 + 's';
                p.style.animationDuration = (6 + Math.random() * 6) + 's';
                container.appendChild(p);
            }
        }
        createParticles();

        // ── Dashboard ────────────────────────────────────────

        const dashToggle = document.getElementById('dashboard-toggle');
        const dashPanel = document.getElementById('dashboard-panel');
        const dashContent = document.getElementById('dash-content');
        let dashVisible = false;

        dashToggle.addEventListener('click', () => {
            dashVisible = !dashVisible;
            dashPanel.classList.toggle('visible', dashVisible);
            dashToggle.classList.toggle('active', dashVisible);
            if (dashVisible) {
                refreshDashboard();
                // Auto-refresh every 10s while dashboard is open
                if (dashAutoRefreshTimer) clearInterval(dashAutoRefreshTimer);
                dashAutoRefreshTimer = setInterval(() => {
                    if (dashVisible) refreshDashboard();
                    else { clearInterval(dashAutoRefreshTimer); dashAutoRefreshTimer = null; }
                }, 10000);
            } else {
                if (dashAutoRefreshTimer) { clearInterval(dashAutoRefreshTimer); dashAutoRefreshTimer = null; }
            }
        });

        async function refreshDashboard() {
            try {
                const [convStats, emotionStats, sessions] = await Promise.all([
                    fetch('http://127.0.0.1:8765/conversations/stats').then(r => r.json()).catch(() => null),
                    fetch('http://127.0.0.1:8765/emotion/stats').then(r => r.json()).catch(() => null),
                    fetch('http://127.0.0.1:8765/conversations?limit=5').then(r => r.json()).catch(() => null),
                ]);

                let html = '';

                // Conversation stats
                if (convStats && convStats.total_messages !== undefined) {
                    html += `<div class="dash-section">
                        <h4>💬 Conversaciones</h4>
                        <div class="dash-row"><span class="label">Mensajes totales</span><span class="value">${convStats.total_messages || 0}</span></div>
                        <div class="dash-row"><span class="label">Sesiones</span><span class="value">${convStats.total_sessions || 0}</span></div>
                        <div class="dash-row"><span class="label">Mensajes sesion actual</span><span class="value">${convStats.current_session_messages || 0}</span></div>
                    </div>`;
                }

                // Emotion stats
                if (emotionStats && emotionStats.total_analyzed > 0) {
                    const dist = emotionStats.emotion_distribution || {};
                    const sorted = Object.entries(dist).sort((a, b) => b[1] - a[1]);
                    let chips = sorted.map(([emo, count]) => {
                        const emoji = emotionEmojis[emo] || '😐';
                        return `<span class="dash-emotion-chip">${emoji} ${emo} (${count})</span>`;
                    }).join('');
                    html += `<div class="dash-section">
                        <h4>🎭 Emociones</h4>
                        <div class="dash-row"><span class="label">Analizados</span><span class="value">${emotionStats.total_analyzed}</span></div>
                        <div class="dash-row"><span class="label">Confianza prom.</span><span class="value">${Math.round((emotionStats.avg_confidence || 0) * 100)}%</span></div>
                        ${emotionStats.compound_count ? `<div class="dash-row"><span class="label">Compuestas</span><span class="value">${emotionStats.compound_count}</span></div>` : ''}
                        ${emotionStats.mood_trend ? `<div class="dash-row"><span class="label">Tendencia</span><span class="value">${emotionEmojis[emotionStats.mood_trend] || ''} ${emotionStats.mood_trend}</span></div>` : ''}
                        <div class="dash-emotion-bar">${chips}</div>
                        <canvas id="emotion-sparkline" width="260" height="50" style="width:100%;height:50px;margin:6px 0;border-radius:6px;background:rgba(0,0,0,0.2);"></canvas>
                        <div id="emotion-timeline"></div>
                        <div id="emotion-heatmap"></div>
                    </div>`;
                    // Render sparkline after DOM update
                    setTimeout(() => renderEmotionSparkline(), 50);
                } else if (emotionStats) {
                    html += `<div class="dash-section">
                        <h4>🎭 Emociones</h4>
                        <div class="dash-row"><span class="label">Analizados</span><span class="value">0</span></div>
                    </div>`;
                }

                // Quick Actions (Session 38)
                html += `<div class="dash-section">
                    <h4>⚡ Acciones rápidas</h4>
                    <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;">
                        <button class="dash-refresh" onclick="quickAction('systeminfo')" style="margin:0;font-size:10px;">💻 Sistema</button>
                        <button class="dash-refresh" onclick="quickAction('weather')" style="margin:0;font-size:10px;">🌤️ Clima</button>
                        <button class="dash-refresh" onclick="quickAction('volume')" style="margin:0;font-size:10px;">🔊 Volumen</button>
                        <button class="dash-refresh" onclick="quickAction('cache')" style="margin:0;font-size:10px;">🗑️ Cache</button>
                        <button class="dash-refresh" onclick="quickAction('patterns')" style="margin:0;font-size:10px;">📊 Patrones</button>
                    </div>
                    <div id="quick-action-result" style="margin-top:4px;font-size:10px;color:#aaa;"></div>
                </div>`;

                // Recent sessions
                if (sessions && sessions.sessions && sessions.sessions.length > 0) {
                    html += `<div class="dash-section">
                        <h4>📋 Sesiones recientes</h4>`;
                    sessions.sessions.forEach(s => {
                        const time = s.started_at ? new Date(s.started_at).toLocaleString('es-CL', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' }) : '?';
                        html += `<div class="dash-session" style="cursor:pointer;" onclick="viewSession('${s.session_id}')">
                            <span>${s.message_count || 0} msgs</span>
                            <span class="session-time">${time}</span>
                            ${s.summary ? `<div style="color:#666;font-size:9px;margin-top:1px;">${escapeHtml(s.summary)}</div>` : ''}
                        </div>`;
                    });
                    html += `</div>`;
                }

                // Conversation search
                html += `<div class="dash-section">
                    <h4>🔍 Buscar conversaciones</h4>
                    <div style="display:flex;gap:4px;margin-bottom:4px;">
                        <input type="text" id="dash-search-input" placeholder="Buscar..." style="flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(150,50,255,0.2);border-radius:6px;padding:4px 8px;color:#e0e0ff;font-size:10px;outline:none;">
                        <button class="dash-refresh" onclick="searchConversations()" style="margin:0;">🔍</button>
                    </div>
                    <div id="dash-search-results"></div>
                </div>`;

                // Notes with search
                let notes = null;
                try {
                    notes = await fetch('http://127.0.0.1:8765/notes').then(r => r.json()).catch(() => null);
                } catch(e) {}
                html += `<div class="dash-section">
                    <h4>📝 Notas</h4>`;
                if (notes && notes.notes && notes.notes.length > 0) {
                    html += `<div style="display:flex;gap:4px;margin-bottom:4px;">
                        <input type="text" id="dash-notes-search" placeholder="Buscar notas..." style="flex:1;background:rgba(255,255,255,0.04);border:1px solid rgba(150,50,255,0.2);border-radius:6px;padding:4px 8px;color:#e0e0ff;font-size:10px;outline:none;">
                        <button class="dash-refresh" onclick="searchNotes()" style="margin:0;">🔍</button>
                    </div>
                    <div id="dash-notes-results"></div>`;
                    notes.notes.slice(0, 5).forEach(n => {
                        html += `<div class="dash-session">
                            <span style="color:#cc99ff;">${escapeHtml(n.title)}</span>
                            <span class="session-time">${n.modified || ''}</span>
                        </div>`;
                    });
                } else {
                    html += `<div style="color:#666;font-size:10px;">No hay notas guardadas</div>`;
                }
                html += `</div>`;

                // Voice mode
                let asrStatus = null;
                try {
                    asrStatus = await fetch('http://127.0.0.1:8765/asr/status').then(r => r.json()).catch(() => null);
                } catch(e) {}
                html += `<div class="dash-section">
                    <h4>🎤 Voz</h4>
                    <div class="dash-row"><span class="label">Modo TTS</span><span class="value">Edge TTS (Microsoft)</span></div>
                    <div class="dash-row"><span class="label">Voz</span><span class="value">es-CL-CatalinaNeural 🇨🇱</span></div>`;
                if (asrStatus) {
                    const asrBackend = asrStatus.backend === 'mimo-asr' ? '☁️ MiMo API' : (asrStatus.backend === 'whisper' ? '🔊 Whisper local' : '❌ No disponible');
                    html += `<div class="dash-row"><span class="label">ASR</span><span class="value">${asrBackend}</span></div>`;
                    if (asrStatus.whisper_loaded) {
                        html += `<div class="dash-row"><span class="label">Whisper</span><span class="value">${asrStatus.whisper_model}</span></div>`;
                    }
                }
                html += `</div>`;

                // System info
                let sysInfo = null;
                try {
                    sysInfo = await fetch('http://127.0.0.1:8765/status').then(r => r.json()).catch(() => null);
                } catch(e) {}
                if (sysInfo) {
                    html += `<div class="dash-section">
                        <h4>💻 Sistema</h4>
                        <div class="dash-row"><span class="label">CPU</span><span class="value">${sysInfo.cpu || '?'}%</span></div>
                        <div class="dash-row"><span class="label">RAM</span><span class="value">${sysInfo.ram || '?'}%</span></div>
                        <div class="dash-row"><span class="label">Disco</span><span class="value">${sysInfo.disk || '?'}%</span></div>
                    </div>`;
                }

                html += `<button class="dash-refresh" onclick="refreshDashboard()">↻ Actualizar</button>`;
                dashContent.innerHTML = html || '<div style="color:#666">No hay datos disponibles. ¿El servicio está corriendo?</div>';
                // Render emotion timeline after DOM update
                renderEmotionTimeline();
                renderEmotionHeatmap('emotion-heatmap');
            } catch (e) {
                dashContent.innerHTML = '<div style="color:#666">Error al cargar dashboard. Verifica conexion.</div>';
            }
        }

        async function searchConversations() {
            const input = document.getElementById('dash-search-input');
            const resultsDiv = document.getElementById('dash-search-results');
            if (!input || !resultsDiv) return;
            const query = input.value.trim();
            if (!query) { resultsDiv.innerHTML = ''; return; }

            try {
                const resp = await fetch(`http://127.0.0.1:8765/conversations/search?q=${encodeURIComponent(query)}&limit=5`);
                const data = await resp.json();
                const results = data.results || [];

                if (results.length === 0) {
                    resultsDiv.innerHTML = '<div style="color:#666;font-size:10px;padding:4px 0;">Sin resultados</div>';
                } else {
                    let html = '';
                    results.forEach(r => {
                        const time = r.timestamp ? new Date(r.timestamp).toLocaleString('es-CL', { hour: '2-digit', minute: '2-digit' }) : '';
                        const role = r.role === 'user' ? '👤' : '🌙';
                        html += `<div style="padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:10px;">
                            <span style="color:#666;">${role} ${time}</span>
                            <div style="color:#aaa;margin-top:1px;">${escapeHtml((r.content || '').substring(0, 100))}</div>
                        </div>`;
                    });
                    resultsDiv.innerHTML = html;
                }
            } catch (e) {
                resultsDiv.innerHTML = '<div style="color:#666;font-size:10px;">Error en búsqueda</div>';
            }
        }

        // ── View Session Messages ─────────────────────────────
        async function viewSession(sessionId) {
            const resultsDiv = document.getElementById('dash-search-results') || document.createElement('div');
            try {
                const resp = await fetch(`http://127.0.0.1:8765/conversations/${encodeURIComponent(sessionId)}`);
                if (!resp.ok) {
                    resultsDiv.innerHTML = '<div style="color:#666;font-size:10px;">Sesión no encontrada</div>';
                    return;
                }
                const data = await resp.json();
                const messages = data.messages || [];

                let html = `<div style="margin-top:8px;">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
                        <span style="color:#cc99ff;font-size:11px;font-weight:600;">📋 Sesión ${data.session_id}</span>
                        <span style="color:#666;font-size:9px;">${data.message_count || 0} mensajes</span>
                    </div>`;

                if (messages.length === 0) {
                    html += '<div style="color:#666;font-size:10px;">Sin mensajes en esta sesión</div>';
                } else {
                    messages.forEach(m => {
                        const role = m.role === 'user' ? '👤' : '🌙';
                        const color = m.role === 'user' ? 'rgba(100,100,255,0.1)' : 'rgba(150,50,255,0.1)';
                        const content = escapeHtml((m.content || '').substring(0, 200));
                        html += `<div style="padding:4px 6px;margin-bottom:3px;background:${color};border-radius:6px;font-size:10px;">
                            <span style="margin-right:4px;">${role}</span>
                            <span style="color:#bbb;">${content}</span>
                        </div>`;
                    });
                }
                html += '</div>';
                resultsDiv.innerHTML = html;
            } catch (e) {
                resultsDiv.innerHTML = '<div style="color:#666;font-size:10px;">Error al cargar sesión</div>';
            }
        }

        async function searchNotes() {
            const input = document.getElementById('dash-notes-search');
            const resultsDiv = document.getElementById('dash-notes-results');
            if (!input || !resultsDiv) return;
            const query = input.value.trim().toLowerCase();
            if (!query) { resultsDiv.innerHTML = ''; return; }

            try {
                const notesResp = await fetch('http://127.0.0.1:8765/notes');
                const notesData = await notesResp.json();
                const allNotes = notesData.notes || [];
                const filtered = allNotes.filter(n => (n.title || '').toLowerCase().includes(query));

                if (filtered.length === 0) {
                    resultsDiv.innerHTML = '<div style="color:#666;font-size:10px;padding:4px 0;">Sin resultados</div>';
                } else {
                    let html = '';
                    filtered.forEach(n => {
                        html += `<div style="padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:10px;cursor:pointer;" onclick="viewNote('${escapeHtml(n.title)}')">
                            <span style="color:#cc99ff;">${escapeHtml(n.title)}</span>
                            <span style="color:#666;font-size:9px;margin-left:4px;">${n.modified || ''}</span>
                        </div>`;
                    });
                    resultsDiv.innerHTML = html;
                }
            } catch (e) {
                resultsDiv.innerHTML = '<div style="color:#666;font-size:10px;">Error en búsqueda</div>';
            }
        }

        async function viewNote(title) {
            try {
                const resp = await fetch(`http://127.0.0.1:8765/notes/${encodeURIComponent(title)}`);
                const data = await resp.json();
                const content = data.content || 'Sin contenido';
                addMessage(`📝 ${title}:\n${content}`, 'system');
            } catch (e) {
                addMessage('⚠️ Error al leer nota', 'system');
            }
        }

        console.log('🌙 Luna JARVIS overlay loaded');
    </script>
</body>
</html>
